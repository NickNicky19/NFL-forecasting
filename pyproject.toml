[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-forecasting-lab"
version = "0.1.0"
description = "Cutoff-aware NFL forecasting research and capture lab"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2", "requests>=2.31,<3", "pyarrow>=17,<24", "jsonschema>=4.18,<5", "referencing>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.18,<5"]

[project.scripts]
nfl-lab = "nfl_lab.cli:main"

[tool.setuptools.packages.find]
include = ["nfl_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
