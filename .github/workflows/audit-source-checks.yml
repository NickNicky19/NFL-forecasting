name: Audit source checks

on:
  pull_request:
    branches: [research/pooled-ypa-20261022, research/weekly-storage-probe-v1]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      ARROW_DEFAULT_MEMORY_POOL: 'system'
      ARROW_IO_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_CORETYPE: 'Haswell'
      VECLIB_MAXIMUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: NickNicky19/nicks-expert-nfl-picks
          ref: 89512ed952308dacc1f6a930915ddbcdccd460d9
          path: r0-public-reference
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact numerical and test dependencies
        run: python -m pip install -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock -e '.[test]'
      - name: Run repository acceptance checks
        env:
          NFL_R0_SOURCE_REPOSITORY: ${{ github.workspace }}/r0-public-reference
        run: python -m pytest -q
