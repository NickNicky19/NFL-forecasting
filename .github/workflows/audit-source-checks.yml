name: Audit source checks

on:
  pull_request:
    branches: [research/pooled-ypa-20261022, research/weekly-storage-probe-v1]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact numerical and test dependencies
        run: python -m pip install -r requirements.lock -e '.[test]'
      - name: Run repository acceptance checks
        run: python -m pytest -q
