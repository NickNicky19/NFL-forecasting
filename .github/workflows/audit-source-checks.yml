name: Audit source checks

on:
  pull_request:
    branches: [research/pooled-ypa-20261022, research/weekly-storage-probe-v1]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  ARROW_DEFAULT_MEMORY_POOL: 'system'
  ARROW_IO_THREADS: '2'
  MALLOC_ARENA_MAX: '2'
  NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
  OMP_THREAD_LIMIT: '2'
  OPENBLAS_CORETYPE: 'Haswell'
  VECLIB_MAXIMUM_THREADS: '2'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record existing job wall budget
        run: python3 -c 'import os,time;open(os.environ["GITHUB_ENV"],"a").write("AUDIT_SOURCE_CI_STARTED_EPOCH="+str(time.time())+"\n")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          repository: NickNicky19/nicks-expert-nfl-picks
          ref: 89512ed952308dacc1f6a930915ddbcdccd460d9
          path: r0-public-reference
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact numerical and test dependencies
        timeout-minutes: 4
        run: python -m pip install -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock -e '.[test]'
      - name: Independently collect every source test
        id: tests
        env:
          NFL_R0_SOURCE_REPOSITORY: ${{ github.workspace }}/r0-public-reference
        run: python -u -B tools/audit_source_ci_v1.py collect --output "${{ runner.temp }}/source-ci/collect" --seconds 960
      - name: Finalize durable collection receipt
        if: always()
        run: python -B tools/audit_source_ci_v1.py finish --output "${{ runner.temp }}/source-ci/collect" --step-status "${{ steps.tests.outcome }}" --job-status "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-source-ci-collection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-ci/collect
          if-no-files-found: error
          retention-days: 14

  shards:
    name: source-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Record existing job wall budget
        run: python3 -c 'import os,time;open(os.environ["GITHUB_ENV"],"a").write("AUDIT_SOURCE_CI_STARTED_EPOCH="+str(time.time())+"\n")'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          repository: NickNicky19/nicks-expert-nfl-picks
          ref: 89512ed952308dacc1f6a930915ddbcdccd460d9
          path: r0-public-reference
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact numerical and test dependencies
        timeout-minutes: 4
        run: python -m pip install -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock -e '.[test]'
      - name: Independently collect all tests and execute this exact partition
        id: tests
        env:
          NFL_R0_SOURCE_REPOSITORY: ${{ github.workspace }}/r0-public-reference
        run: python -u -B tools/audit_source_ci_v1.py run --shard ${{ matrix.shard }} --output "${{ runner.temp }}/source-ci/shard-${{ matrix.shard }}" --seconds 960
      - name: Finalize durable attempted completed and outcome receipt
        if: always()
        run: python -B tools/audit_source_ci_v1.py finish --output "${{ runner.temp }}/source-ci/shard-${{ matrix.shard }}" --step-status "${{ steps.tests.outcome }}" --job-status "${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-source-ci-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-ci/shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  offline:
    needs: [collect, shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-source-ci-*-${{ github.run_attempt }}
          path: source-ci-evidence
      - name: Require full exact node coverage and every upstream job successful
        env:
          AUDIT_SOURCE_CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -B tools/audit_source_ci_v1.py verify --artifacts source-ci-evidence --output source-ci-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-ci-final-coverage-${{ github.run_attempt }}
          path: source-ci-coverage.json
          if-no-files-found: error
          retention-days: 14
