      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Qualify the new runtime in a fresh write-token process
        id: rotation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          AUDIT_PRIVATE_ROTATION_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_PRIVATE_ROTATION_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          AUDIT_PRIVATE_ROTATION_HANDOFF_JSON: ${{ needs.audit-private-rotation-read-v1.outputs.handoff_json }}
          AUDIT_PRIVATE_ROTATION_HANDOFF_SHA256: ${{ needs.audit-private-rotation-read-v1.outputs.handoff_sha256 }}
        run: timeout --signal=KILL 190s python3 -I -B tools/audit_private_rotation_v1.py qualify --execute

  audit-weekly-produce-v1:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'audit-weekly-producer-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      archive_handoff_json: ${{ steps.weekly.outputs.archive_handoff_json || steps.preserve.outputs.archive_handoff_json }}
      grade_only_plan_json: ${{ steps.weekly.outputs.grade_only_plan_json }}
      grade_only_plan_sha256: ${{ steps.weekly.outputs.grade_only_plan_sha256 }}
      history_planning_json: ${{ steps.weekly.outputs.history_planning_json }}
      history_planning_sha256: ${{ steps.weekly.outputs.history_planning_sha256 }}
      controller_template_handoff_json: ${{ steps.weekly.outputs.controller_template_handoff_json }}
      controller_template_handoff_sha256: ${{ steps.weekly.outputs.controller_template_handoff_sha256 }}
      controller_writer_native_json: ${{ steps.weekly.outputs.controller_writer_native_json }}
      controller_writer_native_sha256: ${{ steps.weekly.outputs.controller_writer_native_sha256 }}
      archive_handoff_sha256: ${{ steps.weekly.outputs.archive_handoff_sha256 || steps.preserve.outputs.archive_handoff_sha256 }}
      failure_handoff_json: ${{ steps.preserve.outputs.failure_handoff_json }}
      failure_handoff_sha256: ${{ steps.preserve.outputs.failure_handoff_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      OPENBLAS_CORETYPE: 'Haswell'
      NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
      STORE_PERMISSION: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Mask private dispatch metadata before environment logging
        run: python3 tools/mask_dispatch_inputs.py
      - uses: actions/checkout@v4
        with:
          repository: NickNicky19/nicks-expert-nfl-picks
          ref: 89512ed952308dacc1f6a930915ddbcdccd460d9
          path: r0-public-reference
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact existing numerical dependencies
        run: |
          python -m pip --disable-pip-version-check install --only-binary=:all: --no-deps -r requirements-hosted-fixed-build-v1.lock -r requirements-audit-weekly-metadata-v1.lock
      - name: Capture all effective candidates, selected rows and original R0
        id: weekly
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          NFL_R0_SOURCE_REPOSITORY: ${{ github.workspace }}/r0-public-reference
        run: |
          set +e
          timeout --signal=KILL 1510s python -I -B tools/audit_weekly_hosted_v1.py produce --execute
          weekly_phase_exit=$?
          printf 'exit_code=%s\n' "$weekly_phase_exit" >> "$GITHUB_OUTPUT"
          exit "$weekly_phase_exit"
      - name: Preserve a failed or partial attempt in a fresh process
        id: preserve
        if: ${{ always() && !cancelled() && steps.weekly.outcome == 'failure' }}
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_ORIGINAL_EXIT_CODE: ${{ steps.weekly.outputs.exit_code }}
          NFL_R0_SOURCE_REPOSITORY: ${{ github.workspace }}/r0-public-reference
        run: timeout --signal=KILL 400s python -I -B tools/audit_weekly_hosted_v1.py preserve --execute

  audit-weekly-restore-v1:
    needs: audit-weekly-produce-v1
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'audit-weekly-producer-v1' && github.run_attempt == 1 && (needs.audit-weekly-produce-v1.outputs.archive_handoff_json != '' || needs.audit-weekly-produce-v1.outputs.failure_handoff_json != '' || needs.audit-weekly-produce-v1.outputs.controller_template_handoff_json != '' || needs.audit-weekly-produce-v1.outputs.grade_only_plan_json != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: write
      actions: read
    outputs:
      reader_handoff_json: ${{ steps.weekly.outputs.archive_reader_handoff_json }}
      reader_handoff_sha256: ${{ steps.weekly.outputs.archive_reader_handoff_sha256 }}
      grade_checkpoint_handoff_json: ${{ steps.weekly.outputs.grade_checkpoint_handoff_json }}
      controller_template_seal_json: ${{ steps.weekly.outputs.controller_template_seal_json }}
      controller_template_seal_sha256: ${{ steps.weekly.outputs.controller_template_seal_sha256 }}
      controller_reader_native_json: ${{ steps.weekly.outputs.controller_reader_native_json }}
      controller_reader_native_sha256: ${{ steps.weekly.outputs.controller_reader_native_sha256 }}
      grade_checkpoint_handoff_sha256: ${{ steps.weekly.outputs.grade_checkpoint_handoff_sha256 }}
      failure_handoff_json: ${{ steps.preserve.outputs.failure_handoff_json }}
      failure_handoff_sha256: ${{ steps.preserve.outputs.failure_handoff_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      OPENBLAS_CORETYPE: 'Haswell'
      NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
      STORE_PERMISSION: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Mask private dispatch metadata before environment logging
        run: python3 tools/mask_dispatch_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact metadata dependencies
        run: |
          python -m pip --disable-pip-version-check install --only-binary=:all: --no-deps -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock
      - name: Restore complete capture or failed evidence in a fresh job
        id: weekly
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_ARCHIVE_HANDOFF_JSON: ${{ needs.audit-weekly-produce-v1.outputs.archive_handoff_json }}
          AUDIT_WEEKLY_HISTORY_PLANNING_JSON: ${{ needs.audit-weekly-produce-v1.outputs.history_planning_json }}
          AUDIT_WEEKLY_HISTORY_PLANNING_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.history_planning_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_HANDOFF_JSON: ${{ needs.audit-weekly-produce-v1.outputs.controller_template_handoff_json }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_HANDOFF_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.controller_template_handoff_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_WRITER_NATIVE_JSON: ${{ needs.audit-weekly-produce-v1.outputs.controller_writer_native_json }}
          AUDIT_WEEKLY_CONTROLLER_WRITER_NATIVE_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.controller_writer_native_sha256 }}
          AUDIT_WEEKLY_ARCHIVE_HANDOFF_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.archive_handoff_sha256 }}
          AUDIT_WEEKLY_FAILURE_HANDOFF_JSON: ${{ needs.audit-weekly-produce-v1.outputs.failure_handoff_json }}
          AUDIT_WEEKLY_FAILURE_HANDOFF_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.failure_handoff_sha256 }}
        run: |
          set +e
          timeout --signal=KILL 400s python -I -B tools/audit_weekly_hosted_v1.py restore --execute
          weekly_phase_exit=$?
          printf 'exit_code=%s\n' "$weekly_phase_exit" >> "$GITHUB_OUTPUT"
          exit "$weekly_phase_exit"

      - name: Preserve the original reader failure in a fresh process
        id: preserve
        if: ${{ always() && !cancelled() && steps.weekly.outcome == 'failure' }}
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_ORIGINAL_EXIT_CODE: ${{ steps.weekly.outputs.exit_code }}
        run: timeout --signal=KILL 300s python -I -B tools/audit_weekly_hosted_v1.py preserve --execute

  audit-weekly-export-v1:
    needs: [audit-weekly-produce-v1, audit-weekly-restore-v1]
    if: ${{ !cancelled() && needs.audit-weekly-produce-v1.result == 'success' && needs.audit-weekly-restore-v1.result == 'success' && (needs.audit-weekly-restore-v1.outputs.reader_handoff_json != '' || needs.audit-weekly-restore-v1.outputs.controller_template_seal_json != '' || (needs.audit-weekly-produce-v1.outputs.grade_only_plan_json != '' && needs.audit-weekly-restore-v1.outputs.grade_checkpoint_handoff_json != '')) && github.event_name == 'workflow_dispatch' && inputs.mode == 'audit-weekly-producer-v1' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: write
      actions: read
    outputs:
      failure_handoff_json: ${{ steps.preserve.outputs.failure_handoff_json }}
      failure_handoff_sha256: ${{ steps.preserve.outputs.failure_handoff_sha256 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      OPENBLAS_CORETYPE: 'Haswell'
      NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
      STORE_PERMISSION: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Mask private dispatch metadata before environment logging
        run: python3 tools/mask_dispatch_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact metadata dependencies
        run: |
          python -m pip --disable-pip-version-check install --only-binary=:all: --no-deps -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock
      - name: Recover, verify and publish only the approved derived public feed
        id: weekly
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_READER_HANDOFF_JSON: ${{ needs.audit-weekly-restore-v1.outputs.reader_handoff_json }}
          AUDIT_WEEKLY_READER_HANDOFF_SHA256: ${{ needs.audit-weekly-restore-v1.outputs.reader_handoff_sha256 }}
          AUDIT_WEEKLY_GRADE_HANDOFF_JSON: ${{ needs.audit-weekly-restore-v1.outputs.grade_checkpoint_handoff_json }}
          AUDIT_WEEKLY_HISTORY_PLANNING_JSON: ${{ needs.audit-weekly-produce-v1.outputs.history_planning_json }}
          AUDIT_WEEKLY_HISTORY_PLANNING_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.history_planning_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_HANDOFF_JSON: ${{ needs.audit-weekly-produce-v1.outputs.controller_template_handoff_json }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_HANDOFF_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.controller_template_handoff_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_WRITER_NATIVE_JSON: ${{ needs.audit-weekly-produce-v1.outputs.controller_writer_native_json }}
          AUDIT_WEEKLY_CONTROLLER_WRITER_NATIVE_SHA256: ${{ needs.audit-weekly-produce-v1.outputs.controller_writer_native_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_SEAL_JSON: ${{ needs.audit-weekly-restore-v1.outputs.controller_template_seal_json }}
          AUDIT_WEEKLY_CONTROLLER_TEMPLATE_SEAL_SHA256: ${{ needs.audit-weekly-restore-v1.outputs.controller_template_seal_sha256 }}
          AUDIT_WEEKLY_CONTROLLER_READER_NATIVE_JSON: ${{ needs.audit-weekly-restore-v1.outputs.controller_reader_native_json }}
          AUDIT_WEEKLY_CONTROLLER_READER_NATIVE_SHA256: ${{ needs.audit-weekly-restore-v1.outputs.controller_reader_native_sha256 }}
          AUDIT_WEEKLY_GRADE_HANDOFF_SHA256: ${{ needs.audit-weekly-restore-v1.outputs.grade_checkpoint_handoff_sha256 }}
        run: |
          set +e
          timeout --signal=KILL 400s python -I -B tools/audit_weekly_hosted_v1.py consume --execute
          weekly_phase_exit=$?
          printf 'exit_code=%s\n' "$weekly_phase_exit" >> "$GITHUB_OUTPUT"
          exit "$weekly_phase_exit"
      - name: Upload only the closed controller SAFE_SEAL metadata
        id: controller_seal_upload
        if: ${{ success() && steps.weekly.outputs.controller_safe_seal_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: controller-root-safe-seal-v2-${{ github.run_id }}
          path: ${{ steps.weekly.outputs.controller_safe_seal_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Preserve an original export failure without publishing partial output
        id: preserve
        if: ${{ always() && !cancelled() && (steps.weekly.outcome == 'failure' || steps.controller_seal_upload.outcome == 'failure') }}
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_ORIGINAL_EXIT_CODE: ${{ steps.weekly.outcome == 'failure' && steps.weekly.outputs.exit_code || '' }}
          AUDIT_WEEKLY_FAILED_ACTION_STEP: ${{ steps.controller_seal_upload.outcome == 'failure' && 'Upload only the closed controller SAFE_SEAL metadata' || '' }}
        run: timeout --signal=KILL 300s python -I -B tools/audit_weekly_hosted_v1.py preserve --execute

  audit-weekly-failure-restore-v1:
    needs: [audit-weekly-produce-v1, audit-weekly-restore-v1, audit-weekly-export-v1]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'audit-weekly-producer-v1' && github.run_attempt == 1 && (needs.audit-weekly-restore-v1.outputs.failure_handoff_json != '' || needs.audit-weekly-export-v1.outputs.failure_handoff_json != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      OPENBLAS_CORETYPE: 'Haswell'
      NPY_DISABLE_CPU_FEATURES: 'AVX512F,AVX512CD,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR,AVX2,FMA3,AVX,F16C,SSE41,SSE42,SSSE3,POPCNT'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
      STORE_PERMISSION: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Mask private dispatch metadata before environment logging
        run: python3 tools/mask_dispatch_inputs.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact metadata dependencies
        run: |
          python -m pip --disable-pip-version-check install --only-binary=:all: --no-deps -r requirements.lock -r requirements-audit-weekly-metadata-v1.lock
      - name: Independently restore the failed reader or exporter evidence
        env:
          AUDIT_WEEKLY_ROOT_GO_JSON: ${{ inputs.inference_builder_go_json }}
          AUDIT_WEEKLY_ROOT_GO_SHA256: ${{ inputs.inference_builder_go_sha256 }}
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_WEEKLY_FAILURE_HANDOFF_JSON: ${{ needs.audit-weekly-export-v1.outputs.failure_handoff_json || needs.audit-weekly-restore-v1.outputs.failure_handoff_json }}
          AUDIT_WEEKLY_FAILURE_HANDOFF_SHA256: ${{ needs.audit-weekly-export-v1.outputs.failure_handoff_sha256 || needs.audit-weekly-restore-v1.outputs.failure_handoff_sha256 }}
        run: timeout --signal=KILL 400s python -I -B tools/audit_weekly_hosted_v1.py evidence --execute
