name: NFL research lab

on:
  schedule:
    # One scheduler. Both UTC offsets are gated to08:36 America/Chicago below.
    - cron: '36 13,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, train, grade, replay, storage-probe]
        default: daily
  push:
    branches: [main]
    paths: ['nfl_lab/**', 'tests/**', 'config/**', 'schemas/**', 'pyproject.toml', '.github/workflows/lab.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: nfl-lab-single-writer
  cancel-in-progress: false

jobs:
  lab:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'storage-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce source and publication handover safety
        id: readiness
        run: python3 tools/hosted_safety_guard.py --root . --receipt "$RUNNER_TEMP/nfl-lab-readiness.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact tested dependencies
        run: python -m pip install -r requirements.lock -e '.[test]'
      - name: Acceptance tests
        id: acceptance
        run: python -m pytest -q
      - name: Determine cadence
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json,os
          from nfl_lab.cadence import decision
          result=decision(os.environ['EVENT'],os.environ['MODE'] or None)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'due={str(result["due"]).lower()}\nmode={result["mode"]}\n')
          with open('cadence-result.json','w') as f:json.dump(result,f,indent=2)
          print(result)
          PY
      - name: Restore derived evidence state
        if: steps.cadence.outcome == 'success'
        run: |
          mkdir -p state
          if git show-ref --verify --quiet refs/remotes/origin/lab-state; then
            git archive origin/lab-state state | tar -x
          fi
      - name: Capture and grade
        id: daily
        if: steps.cadence.outputs.due == 'true' && (steps.cadence.outputs.mode == 'daily' || steps.cadence.outputs.mode == 'train')
        run: timeout 900 python -m nfl_lab.cli daily > daily-result.json
      - name: Grade recorded games without pregame issuance
        id: grading
        if: steps.cadence.outcome == 'success' && (steps.cadence.outputs.due == 'false' || steps.cadence.outputs.mode == 'grade')
        run: timeout 300 python -m nfl_lab.cli grade > grading-result.json
      - name: Bounded weekly experiments
        id: training
        if: steps.cadence.outputs.due == 'true' && steps.cadence.outputs.mode == 'train'
        run: |
          timeout 300 python -m nfl_lab.cli acquire > acquire-result.json
          timeout 1200 python -m nfl_lab.cli experiment > experiment-result.json
      - name: Replay immutable records
        id: replay
        if: steps.cadence.outcome == 'success'
        run: python -m nfl_lab.cli replay
      - name: Persist only lab-derived forecasts and corrections
        if: always() && steps.cadence.outcome == 'success'
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          DAILY_OUTCOME: ${{ steps.daily.outcome }}
          GRADING_OUTCOME: ${{ steps.grading.outcome }}
          TRAINING_OUTCOME: ${{ steps.training.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from nfl_lab.state import now_utc,save
          save(Path('state'),'operations',{
              'schema_version':'lab-hosted-operation-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'event':os.environ['GITHUB_EVENT_NAME'],
              'source_commit':os.environ['GITHUB_SHA'],
              'observed_at':now_utc().isoformat(),
              'cadence':json.loads(Path('cadence-result.json').read_text()),
              'step_outcomes':{k:os.environ.get(k) for k in ['ACCEPTANCE_OUTCOME','DAILY_OUTCOME','GRADING_OUTCOME','TRAINING_OUTCOME','REPLAY_OUTCOME']},
              'scope':'workflow environment attestation; verify run identity/conclusion through GitHub Actions API'
          })
          PY
          python tools/persist_state.py
      - name: Upload derived health reports
        if: always() && steps.readiness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            *-result.json
            runs/daily.json
            runs/lab-v1-2026-10-22/**/summary.json
            runs/lab-v1-2026-10-22/**/campaign.json
            runs/lab-v1-2026-10-22/**/manifest.json
            runs/lab-v1-2026-10-22/**/trials.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload exact public-safe readiness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nfl-lab-readiness.json
          retention-days: 14
          if-no-files-found: error
  storage-probe-write:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'storage-probe' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.canary.outputs.release_id }}
      asset_id: ${{ steps.canary.outputs.asset_id }}
      fixture_sha256: ${{ steps.canary.outputs.fixture_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create one harmless unpublished canary
        id: canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: write
        run: timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py write
  storage-probe-read:
    needs: storage-probe-write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require authenticated API and anonymous API/browser denials with controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: read
          RELEASE_ID: ${{ needs.storage-probe-write.outputs.release_id }}
          ASSET_ID: ${{ needs.storage-probe-write.outputs.asset_id }}
          FIXTURE_SHA256: ${{ needs.storage-probe-write.outputs.fixture_sha256 }}
        run: timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py read --release-id "$RELEASE_ID" --asset-id "$ASSET_ID" --expected-sha256 "$FIXTURE_SHA256"
  storage-probe-restore:
    needs: [storage-probe-write, storage-probe-read]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact harmless bytes with a fresh write token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: write
          RELEASE_ID: ${{ needs.storage-probe-write.outputs.release_id }}
          ASSET_ID: ${{ needs.storage-probe-write.outputs.asset_id }}
          FIXTURE_SHA256: ${{ needs.storage-probe-write.outputs.fixture_sha256 }}
        run: timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py restore --release-id "$RELEASE_ID" --asset-id "$ASSET_ID" --expected-sha256 "$FIXTURE_SHA256"
