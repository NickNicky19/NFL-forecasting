name: NFL research lab

on:
  schedule:
    # One scheduler. Both UTC offsets are gated to08:36 America/Chicago below.
    - cron: '36 13,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, train, grade, replay]
        default: daily
  push:
    branches: [main]
    paths: ['nfl_lab/**', 'tests/**', 'config/**', 'schemas/**', 'pyproject.toml', '.github/workflows/lab.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: nfl-lab-single-writer
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact tested dependencies
        run: python -m pip install -r requirements.lock -e '.[test]'
      - name: Acceptance tests
        id: acceptance
        run: python -m pytest -q
      - name: Restore derived evidence state
        if: steps.acceptance.outcome == 'success'
        run: python tools/restore_state.py --source-policy config/operational-source-policy-v2.json
      - name: Determine cadence
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from nfl_lab.cadence import decision
          from nfl_lab.operational_sources import load_source_policy
          from nfl_lab.operational_storage import OperationalStorage
          from nfl_lab.operational_io import operational_io
          result=decision(os.environ['EVENT'],os.environ['MODE'] or None)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'due={str(result["due"]).lower()}\nmode={result["mode"]}\n')
          storage=OperationalStorage(Path('data'),load_source_policy('config/operational-source-policy-v2.json'),state=Path('state'))
          with operational_io(storage,run_root=Path('runs')):
              destination=Path('runs/operational-v2/cadence-result.json')
              with storage.capture_writes(roots=[destination]):
                  storage.write_text(destination,json.dumps(result,indent=2)+'\n',replace=True)
          print(result)
          PY
      - name: Capture and grade
        id: daily
        if: steps.cadence.outputs.due == 'true' && (steps.cadence.outputs.mode == 'daily' || steps.cadence.outputs.mode == 'train')
        run: timeout 540 python -m nfl_lab.cli daily --source-policy config/operational-source-policy-v2.json --output runs/operational-v2/daily-result.json
      - name: Bounded weekly experiments
        id: training
        if: steps.cadence.outputs.due == 'true' && steps.cadence.outputs.mode == 'train'
        run: |
          timeout 180 python -m nfl_lab.cli acquire --source-policy config/operational-source-policy-v2.json --output runs/operational-v2/acquire-result.json
          timeout 720 python -m nfl_lab.cli experiment --source-policy config/operational-source-policy-v2.json --output runs/operational-v2/experiment-result.json
      - name: Grade recorded games without pregame issuance
        id: grading
        if: always() && steps.acceptance.outcome == 'success' && steps.cadence.outcome == 'success' && (steps.cadence.outputs.due == 'false' || steps.cadence.outputs.mode == 'grade' || steps.daily.outcome == 'failure' || steps.training.outcome == 'failure')
        run: timeout 180 python -m nfl_lab.cli grade --source-policy config/operational-source-policy-v2.json --output runs/operational-v2/grading-result.json
      - name: Replay immutable records
        id: replay
        if: always() && steps.acceptance.outcome == 'success' && steps.cadence.outcome == 'success'
        run: python -m nfl_lab.cli replay --source-policy config/operational-source-policy-v2.json --output runs/operational-v2/replay-result.json
      - name: Persist only lab-derived forecasts and corrections
        if: always() && steps.cadence.outcome == 'success'
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          DAILY_OUTCOME: ${{ steps.daily.outcome }}
          GRADING_OUTCOME: ${{ steps.grading.outcome }}
          TRAINING_OUTCOME: ${{ steps.training.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from nfl_lab.state import now_utc
          from nfl_lab import state as lab_state
          from nfl_lab.operational_sources import load_source_policy
          from nfl_lab.operational_storage import OperationalStorage
          from nfl_lab.operational_io import operational_io
          storage=OperationalStorage(Path('data'),load_source_policy('config/operational-source-policy-v2.json'),state=Path('state'))
          with operational_io(storage,run_root=Path('runs')):
              lab_state.save(Path('state'),'operations',{
              'schema_version':'lab-hosted-operation-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'event':os.environ['GITHUB_EVENT_NAME'],
              'source_commit':os.environ['GITHUB_SHA'],
              'observed_at':now_utc().isoformat(),
              'cadence':json.loads(Path('runs/operational-v2/cadence-result.json').read_text()),
              'step_outcomes':{k:os.environ.get(k) for k in ['ACCEPTANCE_OUTCOME','DAILY_OUTCOME','GRADING_OUTCOME','TRAINING_OUTCOME','REPLAY_OUTCOME']},
              'scope':'workflow environment attestation; verify run identity/conclusion through GitHub Actions API'
          })
          PY
          if test -f config/operational-publication-review-v2.json; then
            python tools/persist_state.py --source-policy config/operational-source-policy-v2.json --publication-manifest config/operational-publication-review-v2.json
          else
            python tools/persist_state.py --source-policy config/operational-source-policy-v2.json
          fi
      - name: Upload derived health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/operational-v2/*-result.json
            runs/daily.json
            runs/lab-v1-2026-10-22/**/summary.json
            runs/lab-v1-2026-10-22/**/campaign.json
            runs/lab-v1-2026-10-22/**/manifest.json
            runs/lab-v1-2026-10-22/**/trials.json
          retention-days: 14
          if-no-files-found: ignore
