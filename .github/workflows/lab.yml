name: NFL research lab

on:
  schedule:
    # One scheduler: explicit Parent 07:36; legacy 08:36. Each gates one DST slot.
    - cron: '36 12,13,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [daily, train, grade, replay, storage-probe, storage-probe-existing, storage-probe-diagnostic-v1, private-draft-canary-v2, owner-bootstrap-restore-v1, genuine-hosted-fixed-build-v1, genuine-hosted-inference-continuation-v3, audit-count-requalify-v1, audit-count-retained-v1, audit-private-rotation-v1, audit-weekly-producer-v1]
        default: daily
      bootstrap_locators_json:
        description: 'Canonical safe bootstrap locator envelope; IDs/hashes only'
        type: string
        required: false
        default: ''
      bootstrap_locators_sha256:
        description: 'SHA256 of the exact canonical locator envelope'
        type: string
        required: false
        default: ''
      build_registration_json:
        description: 'Canonical root-registered NEW fixed18 build and nested15Z initial registration'
        type: string
        required: false
        default: ''
      build_registration_sha256:
        description: 'SHA256 of the exact new build registration'
        type: string
        required: false
        default: ''
      inference_builder_go_json:
        description: 'Canonical safe root approval for the reviewed metadata plan builder'
        type: string
        required: false
        default: ''
      inference_builder_go_sha256:
        description: 'SHA256 of the exact metadata builder approval'
        type: string
        required: false
        default: ''
      public_release_go_json:
        description: 'Canonical safe root registration for derived publication only'
        type: string
        required: false
        default: ''
      public_release_go_sha256:
        description: 'SHA256 of the exact derived-publication registration'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['nfl_lab/**', 'tests/**', 'config/**', 'schemas/**', 'pyproject.toml', '.github/workflows/lab.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: nfl-lab-single-writer
  cancel-in-progress: false

env:
  INITIAL_ROUTE_VERSION: ${{ inputs.mode == 'genuine-hosted-inference-continuation-v3' && '3' || (fromJSON(inputs.build_registration_json || '{}').schema_version == 'genuine-hosted-fixed-build-registration-v2' && '2' || '1') }}

jobs:
  lab:
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'storage-probe' && inputs.mode != 'storage-probe-existing' && inputs.mode != 'storage-probe-diagnostic-v1' && inputs.mode != 'private-draft-canary-v2' && inputs.mode != 'owner-bootstrap-restore-v1' && inputs.mode != 'genuine-hosted-fixed-build-v1' && inputs.mode != 'genuine-hosted-inference-continuation-v3' && inputs.mode != 'audit-count-requalify-v1' && inputs.mode != 'audit-count-retained-v1' && inputs.mode != 'audit-private-rotation-v1' && inputs.mode != 'audit-weekly-producer-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select explicit main parent route without granting readiness
        id: parent_route
        env:
          PARENT_ENABLED: ${{ vars.AUDIT_WEEKLY_PARENT_ENABLED }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          requested=(os.environ['PARENT_ENABLED']=='true'
              and os.environ['REF']=='refs/heads/main'
              and (os.environ['EVENT']=='schedule'
                  or os.environ['EVENT']=='workflow_dispatch' and os.environ['MODE']=='daily'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'requested={str(requested).lower()}\n')
          PY
      - name: Enforce source and publication handover safety
        id: readiness
        if: steps.parent_route.outputs.requested != 'true'
        run: python3 tools/hosted_safety_guard.py --root . --receipt "$RUNNER_TEMP/nfl-lab-readiness.json"
      - name: Set up metadata-only parent Python
        if: steps.parent_route.outputs.requested == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-audit-weekly-metadata-v1.lock
      - name: Install exact metadata-only parent dependencies
        if: steps.parent_route.outputs.requested == 'true'
        run: 'timeout 90s python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps -r requirements-audit-weekly-metadata-v1.lock'
      - name: Determine parent cadence without enabling legacy research
        id: parent_cadence
        if: steps.parent_route.outputs.requested == 'true'
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json,os
          from nfl_lab.cadence import decision, PARENT_POLICY
          result=decision(os.environ['EVENT'],os.environ['MODE'] or None,policy=PARENT_POLICY)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'due={str(result["due"]).lower()}\nmode={result["mode"]}\n')
          with open('parent-cadence-result.json','w') as f:json.dump(result,f,indent=2)
          print(result)
          PY
      - name: Enqueue one qualified same-source Ops capture and return
        id: weekly_parent
        if: steps.parent_route.outputs.requested == 'true' && steps.parent_cadence.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: timeout --signal=KILL --kill-after=1s 180s python -I -B tools/audit_weekly_parent_v1.py --execute > controller-parent-result.json
      - name: Keep original handover block when parent qualification fails
        id: parent_readiness_block
        if: always() && steps.parent_route.outputs.requested == 'true' && steps.weekly_parent.outcome != 'success'
        run: python3 tools/hosted_safety_guard.py --root . --receipt "$RUNNER_TEMP/nfl-lab-readiness.json"
      - name: Upload public-safe parent enqueue status
        if: always() && steps.parent_route.outputs.requested == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lab-parent-${{ github.run_id }}-${{ github.run_attempt }}
          path: controller-parent-result.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/setup-python@v5
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped'
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact tested dependencies
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped'
        run: python -m pip install -r requirements.lock -e '.[test]'
      - name: Acceptance tests
        id: acceptance
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped'
        run: python -m pytest -q
      - name: Determine cadence
        id: cadence
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped'
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          python - <<'PY'
          import json,os
          from nfl_lab.cadence import decision
          result=decision(os.environ['EVENT'],os.environ['MODE'] or None)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'due={str(result["due"]).lower()}\nmode={result["mode"]}\n')
          with open('cadence-result.json','w') as f:json.dump(result,f,indent=2)
          print(result)
          PY
      - name: Restore derived evidence state
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outcome == 'success'
        run: |
          mkdir -p state
          if git show-ref --verify --quiet refs/remotes/origin/lab-state; then
            git archive origin/lab-state state | tar -x
          fi
      - name: Capture and grade
        id: daily
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outputs.due == 'true' && (steps.cadence.outputs.mode == 'daily' || steps.cadence.outputs.mode == 'train')
        run: timeout 900 python -m nfl_lab.cli daily > daily-result.json
      - name: Grade recorded games without pregame issuance
        id: grading
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outcome == 'success' && (steps.cadence.outputs.due == 'false' || steps.cadence.outputs.mode == 'grade')
        run: timeout 300 python -m nfl_lab.cli grade > grading-result.json
      - name: Bounded weekly experiments
        id: training
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outputs.due == 'true' && steps.cadence.outputs.mode == 'train'
        run: |
          timeout 300 python -m nfl_lab.cli acquire > acquire-result.json
          timeout 1200 python -m nfl_lab.cli experiment > experiment-result.json
      - name: Replay immutable records
        id: replay
        if: steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outcome == 'success'
        run: python -m nfl_lab.cli replay
      - name: Persist only lab-derived forecasts and corrections
        if: always() && steps.parent_route.outputs.requested != 'true' && steps.weekly_parent.outcome == 'skipped' && steps.cadence.outcome == 'success'
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          DAILY_OUTCOME: ${{ steps.daily.outcome }}
          GRADING_OUTCOME: ${{ steps.grading.outcome }}
          TRAINING_OUTCOME: ${{ steps.training.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from nfl_lab.state import now_utc,save
          save(Path('state'),'operations',{
              'schema_version':'lab-hosted-operation-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'event':os.environ['GITHUB_EVENT_NAME'],
              'source_commit':os.environ['GITHUB_SHA'],
              'observed_at':now_utc().isoformat(),
              'cadence':json.loads(Path('cadence-result.json').read_text()),
              'step_outcomes':{k:os.environ.get(k) for k in ['ACCEPTANCE_OUTCOME','DAILY_OUTCOME','GRADING_OUTCOME','TRAINING_OUTCOME','REPLAY_OUTCOME']},
              'scope':'workflow environment attestation; verify run identity/conclusion through GitHub Actions API'
          })
          PY
          python tools/persist_state.py
      - name: Upload derived health reports
        if: always() && steps.readiness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lab-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            *-result.json
            runs/daily.json
            runs/lab-v1-2026-10-22/**/summary.json
            runs/lab-v1-2026-10-22/**/campaign.json
            runs/lab-v1-2026-10-22/**/manifest.json
            runs/lab-v1-2026-10-22/**/trials.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload exact public-safe readiness receipt
        if: always() && (steps.parent_route.outputs.requested != 'true' || steps.weekly_parent.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: lab-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nfl-lab-readiness.json
          retention-days: 14
          if-no-files-found: error
  storage-probe-write:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'storage-probe' || inputs.mode == 'storage-probe-existing' || inputs.mode == 'storage-probe-diagnostic-v1') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.canary.outputs.release_id }}
      asset_id: ${{ steps.canary.outputs.asset_id }}
      fixture_sha256: ${{ steps.canary.outputs.fixture_sha256 }}
      recovery_run_id: ${{ steps.canary.outputs.recovery_run_id }}
      recovery_config_sha256: ${{ steps.canary.outputs.recovery_config_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create harmless canary or pin exact existing canary without writes
        id: canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: write
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          if [ "$PROBE_MODE" = storage-probe-diagnostic-v1 ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py diagnostic-pin
          elif [ "$PROBE_MODE" = storage-probe-existing ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py existing-pin
          elif [ "$PROBE_MODE" = storage-probe ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py write
          else
            exit 1
          fi
  storage-probe-read:
    needs: storage-probe-write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      diagnostic_read_completed: ${{ steps.read_check.outputs.diagnostic_read_completed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require authenticated API and anonymous API/browser denials with controls
        id: read_check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: read
          PROBE_MODE: ${{ inputs.mode }}
          RECOVERY_PIN_RUN_ID: ${{ needs.storage-probe-write.outputs.recovery_run_id }}
          RECOVERY_PIN_CONFIG_SHA256: ${{ needs.storage-probe-write.outputs.recovery_config_sha256 }}
          RELEASE_ID: ${{ needs.storage-probe-write.outputs.release_id }}
          ASSET_ID: ${{ needs.storage-probe-write.outputs.asset_id }}
          FIXTURE_SHA256: ${{ needs.storage-probe-write.outputs.fixture_sha256 }}
        run: |
          if [ "$PROBE_MODE" = storage-probe-diagnostic-v1 ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py diagnostic-read
          elif [ "$PROBE_MODE" = storage-probe-existing ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py existing-read
          elif [ "$PROBE_MODE" = storage-probe ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py read --release-id "$RELEASE_ID" --asset-id "$ASSET_ID" --expected-sha256 "$FIXTURE_SHA256"
          else
            exit 1
          fi
  storage-probe-restore:
    needs: [storage-probe-write, storage-probe-read]
    if: (success() && inputs.mode != 'storage-probe-diagnostic-v1') || (!cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'storage-probe-diagnostic-v1' && github.run_attempt == 1 && needs.storage-probe-write.result == 'success' && needs.storage-probe-read.outputs.diagnostic_read_completed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact harmless bytes with a fresh write token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PERMISSION: write
          PROBE_MODE: ${{ inputs.mode }}
          RECOVERY_PIN_RUN_ID: ${{ needs.storage-probe-write.outputs.recovery_run_id }}
          RECOVERY_PIN_CONFIG_SHA256: ${{ needs.storage-probe-write.outputs.recovery_config_sha256 }}
          DIAGNOSTIC_READ_COMPLETED: ${{ needs.storage-probe-read.outputs.diagnostic_read_completed }}
          RELEASE_ID: ${{ needs.storage-probe-write.outputs.release_id }}
          ASSET_ID: ${{ needs.storage-probe-write.outputs.asset_id }}
          FIXTURE_SHA256: ${{ needs.storage-probe-write.outputs.fixture_sha256 }}
        run: |
          if [ "$PROBE_MODE" = storage-probe-diagnostic-v1 ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py diagnostic-restore
          elif [ "$PROBE_MODE" = storage-probe-existing ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py existing-restore
          elif [ "$PROBE_MODE" = storage-probe ]; then
            timeout --signal=KILL --kill-after=1s 180s python3 -I -B tools/private_storage_probe.py restore --release-id "$RELEASE_ID" --asset-id "$ASSET_ID" --expected-sha256 "$FIXTURE_SHA256"
          else
            exit 1
          fi
  private-draft-v2-write:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'private-draft-canary-v2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    outputs:
      binding_json: ${{ steps.canary.outputs.binding_json }}
      binding_sha256: ${{ steps.canary.outputs.binding_sha256 }}
      before_json: ${{ steps.canary.outputs.before_json }}
      before_sha256: ${{ steps.canary.outputs.before_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Initialize only one harmless draft and pin in a fresh process
        id: canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          CANARY_MODE: ${{ inputs.mode }}
        run: timeout --signal=KILL 360s python3 -I -B tools/private_draft_canary_v2.py write --execute
  private-draft-v2-read:
    needs: private-draft-v2-write
    if: success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'private-draft-canary-v2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
    outputs:
      read_json: ${{ steps.canary.outputs.read_json }}
      read_sha256: ${{ steps.canary.outputs.read_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check only the new harmless canary boundary
        id: canary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: read
          CANARY_MODE: ${{ inputs.mode }}
          CANARY_BINDING_JSON: ${{ needs.private-draft-v2-write.outputs.binding_json }}
          CANARY_BINDING_SHA256: ${{ needs.private-draft-v2-write.outputs.binding_sha256 }}
          CANARY_BEFORE_JSON: ${{ needs.private-draft-v2-write.outputs.before_json }}
          CANARY_BEFORE_SHA256: ${{ needs.private-draft-v2-write.outputs.before_sha256 }}
        run: timeout --signal=KILL 180s python3 -I -B tools/private_draft_canary_v2.py read --execute
  private-draft-v2-qualify:
    needs: [private-draft-v2-write, private-draft-v2-read]
    if: success() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'private-draft-canary-v2' && github.run_attempt == 1 && needs.private-draft-v2-write.result == 'success' && needs.private-draft-v2-read.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fresh write-token canary restoration and safe proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          CANARY_MODE: ${{ inputs.mode }}
          CANARY_BINDING_JSON: ${{ needs.private-draft-v2-write.outputs.binding_json }}
          CANARY_BINDING_SHA256: ${{ needs.private-draft-v2-write.outputs.binding_sha256 }}
          CANARY_BEFORE_JSON: ${{ needs.private-draft-v2-write.outputs.before_json }}
          CANARY_BEFORE_SHA256: ${{ needs.private-draft-v2-write.outputs.before_sha256 }}
          CANARY_READ_JSON: ${{ needs.private-draft-v2-read.outputs.read_json }}
          CANARY_READ_SHA256: ${{ needs.private-draft-v2-read.outputs.read_sha256 }}
        run: timeout --signal=KILL 180s python3 -I -B tools/private_draft_canary_v2.py qualify --execute
  owner-bootstrap-restore-v1:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'owner-bootstrap-restore-v1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact existing opaque storage dependencies
        run: python -m pip --disable-pip-version-check install --requirement requirements.lock
      - name: Restore only the two registered private opaque bundles
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          BOOTSTRAP_MODE: ${{ inputs.mode }}
          BOOTSTRAP_LOCATORS_JSON: ${{ inputs.bootstrap_locators_json }}
          BOOTSTRAP_LOCATORS_SHA256: ${{ inputs.bootstrap_locators_sha256 }}
        run: timeout --signal=KILL --kill-after=1s 450s python -I -B tools/gha_owner_bootstrap_restore_v1.py --execute
  genuine-hosted-fixed-build-v1:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'genuine-hosted-fixed-build-v1' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      checkpoint_handoff_json: ${{ steps.private-checkpoint.outputs.handoff_json }}
      checkpoint_handoff_sha256: ${{ steps.private-checkpoint.outputs.handoff_sha256 }}
    env:
      OMP_NUM_THREADS: '2'
      OMP_THREAD_LIMIT: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      MALLOC_ARENA_MAX: '2'
      ARROW_DEFAULT_MEMORY_POOL: system
      ARROW_IO_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the exact fixed-build dependencies
        run: python -m pip --disable-pip-version-check install --requirement requirements-hosted-fixed-build-v1.lock
      - name: Claim the root one-time registration before source or fits
        id: source-claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          CHECKPOINT_MODE: ${{ inputs.mode }}
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_REGISTRATION_JSON: ${{ inputs.build_registration_json }}
          BUILD_REGISTRATION_SHA256: ${{ inputs.build_registration_sha256 }}
        run: |
          route_args=()
          if [ "$INITIAL_ROUTE_VERSION" = 2 ]; then
            read -r procedure_sha ignored_digest_name < <(sha256sum config/gha-private-checkpoint-v2.json)
            route_args=(--recovery-v2 --config-sha256 "$procedure_sha")
          fi
          timeout --signal=KILL 190s python -I -B tools/gha_private_checkpoint_v1.py claim --execute "${route_args[@]}"
      - name: New genuine source capture and fixed18 operational training only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_PERMISSION: write
          BUILD_MODE: ${{ inputs.mode }}
          BUILD_REGISTRATION_JSON: ${{ inputs.build_registration_json }}
